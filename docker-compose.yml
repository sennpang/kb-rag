services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kb-rag-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kbrag
    ports:
      - "5432:5432"
    volumes:
      - kbrag-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kbrag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kbrag-pgdata:
